id: debugging-loop
name: Debugging Loop
version: 0.1.0
status: beta
summary: >
  Guides a disciplined reproduce, minimize, hypothesize, instrument, fix, and
  regression-test workflow for bugs and failing tests.
category: debugging
triggers:
  - debug this
  - diagnose this bug
  - fix this failing test
  - investigate this failure
  - something is broken
profiles:
  - minimal
  - coding-heavy
targets:
  claude:
    enabled: true
  antigravity:
    enabled: true
  codex:
    enabled: true
  opencode:
    enabled: true
  gemini:
    enabled: false
  markdown:
    enabled: true
safety:
  allow_shell_commands: true
  allow_network: false
  allow_file_writes: true
  includes_scripts: false
tags:
  - debugging
  - diagnosis
  - tests
risk: medium
owner: matthew
